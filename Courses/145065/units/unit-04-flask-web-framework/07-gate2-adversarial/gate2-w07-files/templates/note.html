{% extends "base.html" %}
{% block title %}Note {{ note.id }}{% endblock %}
{% block content %}
<h1>Note {{ note.id }}: {{ machine.code }} {{ machine.name }}</h1>
<p><span class="sev sev-{{ note.severity }}">{{ note.severity | capitalize }}</span>
   left by {{ note.left_by }} at {{ note.left_at }}.</p>
<p>{{ note.text }}</p>
<p><a href="{{ url_for('board_page') }}">Back to the board</a></p>
{% endblock %}
